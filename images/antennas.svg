<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 430' width='940' height='430' role='img'>
<title>Four buildable antenna designs</title>
<rect width='940' height='430' fill='#ffffff'/>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1a1a1a'/></marker></defs>
<text x='20' y='30' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' font-weight='700' fill='#1a1a1a' >Four antennas you can build in an afternoon</text>
<text x='20' y='50' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#5a6570' >L = quarter wavelength = 75000 / f(MHz) millimetres. Dimensions shown for 1090 MHz (ADS-B), where L = 69 mm.</text>
<text x='120' y='82' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='700' fill='#1a1a1a' >1. Quarter-wave ground plane</text>
<line x1='120' y1='120' x2='120' y2='220' stroke='#33689c' stroke-width='3'/>
<text x='128' y='168' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='700' fill='#b4534f' >L</text>
<line x1='120' y1='220' x2='65' y2='250' stroke='#4a5a68' stroke-width='2'/>
<line x1='120' y1='220' x2='175' y2='250' stroke='#4a5a68' stroke-width='2'/>
<line x1='120' y1='220' x2='82' y2='240' stroke='#4a5a68' stroke-width='2'/>
<line x1='120' y1='220' x2='158' y2='240' stroke='#4a5a68' stroke-width='2'/>
<circle cx='120' cy='220' r='5' fill='#1a1a1a'/>
<text x='120' y='265' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10' font-weight='400' fill='#5a6570' >4 radials, also L,</text>
<text x='120' y='278' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10' font-weight='400' fill='#5a6570' >sloping down 45 deg</text>
<text x='120' y='296' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' font-weight='600' fill='#2f7d46' >omnidirectional</text>
<text x='325' y='82' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='700' fill='#1a1a1a' >2. Half-wave dipole</text>
<line x1='325' y1='120' x2='325' y2='168' stroke='#33689c' stroke-width='3'/>
<line x1='325' y1='178' x2='325' y2='226' stroke='#33689c' stroke-width='3'/>
<circle cx='325' cy='173' r='4' fill='#1a1a1a'/>
<text x='335' y='146' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='700' fill='#b4534f' >L</text>
<text x='335' y='204' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='700' fill='#b4534f' >L</text>
<text x='325' y='265' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10' font-weight='400' fill='#5a6570' >two elements of L,</text>
<text x='325' y='278' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10' font-weight='400' fill='#5a6570' >fed in the middle</text>
<text x='325' y='296' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' font-weight='600' fill='#2f7d46' >no ground plane needed</text>
<text x='530' y='82' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='700' fill='#1a1a1a' >3. V-dipole (satellites)</text>
<line x1='530' y1='200' x2='480' y2='135' stroke='#33689c' stroke-width='3'/>
<line x1='530' y1='200' x2='580' y2='135' stroke='#33689c' stroke-width='3'/>
<circle cx='530' cy='200' r='4' fill='#1a1a1a'/>
<path d='M 504 182 A 34 34 0 0 1 556 182' fill='none' stroke='#b4534f' stroke-width='1.2'/>
<text x='530' y='174' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#b4534f' >120 deg</text>
<text x='530' y='265' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10' font-weight='400' fill='#5a6570' >two elements of L at 120 deg,</text>
<text x='530' y='278' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10' font-weight='400' fill='#5a6570' >horizontal, pointing N-S</text>
<text x='530' y='296' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' font-weight='600' fill='#2f7d46' >for overhead passes</text>
<text x='760' y='82' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' font-weight='700' fill='#1a1a1a' >4. Yagi (directional)</text>
<line x1='695' y1='149.0' x2='695' y2='201.0' stroke='#33689c' stroke-width='2.6'/>
<line x1='731' y1='152.0' x2='731' y2='198.0' stroke='#b4534f' stroke-width='2.6'/>
<line x1='761' y1='154.0' x2='761' y2='196.0' stroke='#33689c' stroke-width='2.6'/>
<line x1='787' y1='155.0' x2='787' y2='195.0' stroke='#33689c' stroke-width='2.6'/>
<line x1='811' y1='156.0' x2='811' y2='194.0' stroke='#33689c' stroke-width='2.6'/>
<line x1='695' y1='175' x2='811' y2='175' stroke='#4a5a68' stroke-width='2'/>
<circle cx='731' cy='175' r='4' fill='#1a1a1a'/>
<line x1='815' y1='175' x2='850' y2='175' stroke='#1a1a1a' stroke-width='1.8' marker-end='url(#a)'/>
<text x='833' y='166' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10' font-weight='700' fill='#2f7d46' >gain</text>
<text x='760' y='265' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10' font-weight='400' fill='#5a6570' >reflector, driven element,</text>
<text x='760' y='278' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10' font-weight='400' fill='#5a6570' >then directors</text>
<text x='760' y='296' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' font-weight='600' fill='#2f7d46' >points at ONE thing</text>
<line x1='20' y1='378' x2='920' y2='378' stroke='#d8dee4' stroke-width='1.2'/>
<text x='20' y='400' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='600' fill='#b4534f' >Cut the element LONG, measure, then trim. You can always remove wire; you cannot put it back.</text>
<text x='20' y='418' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#5a6570' font-style='italic'>Every one of these is a piece of wire and an SMA connector. The cheapest part of your station matters the most.</text>
</svg>
