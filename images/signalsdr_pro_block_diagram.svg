<text x='20' y='425' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#5a6570' font-style='italic'>The AD9361 turns RF into numbers. The Zynq moves and reshapes those numbers. Everything above the ADC is physics; everything below it is software.</text>
