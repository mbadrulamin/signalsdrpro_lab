<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 445' width='920' height='445' role='img'>
<title>SignalSDR Pro hardware block diagram</title>
<rect width='920' height='445' fill='#ffffff'/>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1a1a1a'/></marker></defs>
<text x='20' y='28' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' font-weight='700' fill='#1a1a1a' >SignalSDR Pro - hardware block diagram</text>
<text x='20' y='48' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#5a6570' >Analog Devices AD9361 transceiver + AMD Zynq-7020 SoC. Drawn from published specifications.</text>
<rect x='20' y='80' width='120' height='150' rx='6' fill='#f6f0fa' stroke='#7a52a1' stroke-width='1.6'/><text x='80.0' y='151.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>RF ports</text><text x='80.0' y='167.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>TX1/RX1  RX1</text><text x='80.0' y='179.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>TX2/RX2  RX2</text><text x='80.0' y='191.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>SMA female</text><text x='80.0' y='203.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>50 ohm</text>
<rect x='175' y='70' width='250' height='235' rx='6' fill='#eef3f8' stroke='#33689c' stroke-width='1.6'/><text x='300.0' y='191.5' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'></text>
<text x='300' y='92' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' font-weight='700' fill='#1a1a1a' >AD9361 RF Transceiver</text>
<text x='300' y='108' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#5a6570' >70 MHz - 6 GHz  |  2x2 MIMO</text>
<rect x='190' y='122' width='220' height='46' rx='6' fill='#dcebf7' stroke='#33689c' stroke-width='1.6'/><text x='300.0' y='141.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='600' fill='#1a1a1a'>RX chain x2</text><text x='300.0' y='157.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>LNA - mixer - LPF - 12-bit ADC</text>
<rect x='190' y='178' width='220' height='46' rx='6' fill='#dcebf7' stroke='#33689c' stroke-width='1.6'/><text x='300.0' y='197.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='600' fill='#1a1a1a'>TX chain x2</text><text x='300.0' y='213.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>12-bit DAC - LPF - mixer - driver</text>
<rect x='190' y='234' width='220' height='46' rx='6' fill='#dcebf7' stroke='#33689c' stroke-width='1.6'/><text x='300.0' y='253.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='600' fill='#1a1a1a'>Fractional-N synthesisers</text><text x='300.0' y='269.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>independent RX and TX LOs</text>
<rect x='465' y='70' width='250' height='235' rx='6' fill='#eaf6ee' stroke='#2f7d46' stroke-width='1.6'/><text x='590.0' y='191.5' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'></text>
<text x='590' y='92' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' font-weight='700' fill='#1a1a1a' >AMD Zynq-7020 SoC</text>
<text x='590' y='108' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11' font-weight='400' fill='#5a6570' >85K logic cells  |  DDR3</text>
<rect x='480' y='122' width='220' height='74' rx='6' fill='#d9efe0' stroke='#2f7d46' stroke-width='1.6'/><text x='590.0' y='155.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='600' fill='#1a1a1a'>Programmable Logic (FPGA)</text><text x='590.0' y='171.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>DDC / DUC, decimation</text><text x='590.0' y='183.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>packetising, DMA</text><text x='590.0' y='195.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>B210 or Pluto personality</text>
<rect x='480' y='206' width='220' height='74' rx='6' fill='#d9efe0' stroke='#2f7d46' stroke-width='1.6'/><text x='590.0' y='239.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='600' fill='#1a1a1a'>Processing System</text><text x='590.0' y='255.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>dual ARM Cortex-A9</text><text x='590.0' y='267.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>embedded Linux</text><text x='590.0' y='279.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>runs UHD / libiio server</text>
<rect x='755' y='80' width='140' height='150' rx='6' fill='#fdf3e6' stroke='#b97d29' stroke-width='1.6'/><text x='825.0' y='151.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>Host interfaces</text><text x='825.0' y='167.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>USB 3.0 Type-B</text><text x='825.0' y='179.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>Gigabit Ethernet</text><text x='825.0' y='191.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>USB-OTG / TTL</text><text x='825.0' y='203.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>microSD</text><text x='825.0' y='215.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>40-pin GPIO</text><text x='825.0' y='227.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>JTAG</text>
<rect x='175' y='330' width='250' height='62' rx='6' fill='#fdeeee' stroke='#b4534f' stroke-width='1.6'/><text x='300.0' y='357.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>Reference clock</text><text x='300.0' y='373.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>+/- 1 ppm TCXO, built-in GPSDO</text><text x='300.0' y='385.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>external clock input</text>
<rect x='465' y='330' width='250' height='62' rx='6' fill='#fdeeee' stroke='#b4534f' stroke-width='1.6'/><text x='590.0' y='357.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>GNSS receiver</text><text x='590.0' y='373.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>active GPS antenna</text><text x='590.0' y='385.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>disciplines the TCXO</text>
