<text x='800' y='318' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10' font-weight='400' fill='#5a6570' >12-bit  56 MHz  ~$1500</text>
<text x='20' y='349' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#5a6570' font-style='italic'>Two numbers decide almost everything: how wide a slice you can see at once (bandwidth), and how finely you can measure it (bits).</text>
<text x='20' y='369' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#5a6570' font-style='italic'>A wider, deeper receiver costs more and needs a faster host. Transmitting brings legal duties that receiving does not.</text>
