<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1010 338' width='1010' height='338' role='img'>
<title>Superheterodyne versus software-defined radio</title>
<rect width='1010' height='338' fill='#ffffff'/>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1a1a1a'/></marker></defs>
<text x='20' y='30' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' font-weight='700' fill='#1a1a1a' >Where the digital boundary sits</text>
<text x='20' y='52' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' font-weight='400' fill='#5a6570' >Everything to the right of the dashed line is software you can change.</text>
<text x='20' y='92' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#1a1a1a' >Classic superheterodyne receiver  (1918-)</text>
<rect x='20' y='105' width='118' height='52' rx='6' fill='#fdeeee' stroke='#b4534f' stroke-width='1.6'/><text x='79.0' y='135.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>Antenna</text>
<rect x='160' y='105' width='118' height='52' rx='6' fill='#fdeeee' stroke='#b4534f' stroke-width='1.6'/><text x='219.0' y='127.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>RF filter</text><text x='219.0' y='143.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>fixed, tuned</text>
<line x1='138' y1='131.0' x2='157' y2='131.0' stroke='#1a1a1a' stroke-width='1.8' marker-end='url(#a)'/>
<rect x='300' y='105' width='118' height='52' rx='6' fill='#fdeeee' stroke='#b4534f' stroke-width='1.6'/><text x='359.0' y='127.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>Mixer + LO</text><text x='359.0' y='143.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>tunable</text>
<line x1='278' y1='131.0' x2='297' y2='131.0' stroke='#1a1a1a' stroke-width='1.8' marker-end='url(#a)'/>
<rect x='440' y='105' width='118' height='52' rx='6' fill='#fdeeee' stroke='#b4534f' stroke-width='1.6'/><text x='499.0' y='127.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>IF filter</text><text x='499.0' y='143.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>FIXED in glass</text><text x='499.0' y='155.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>or crystal</text>
<line x1='418' y1='131.0' x2='437' y2='131.0' stroke='#1a1a1a' stroke-width='1.8' marker-end='url(#a)'/>
<rect x='580' y='105' width='118' height='52' rx='6' fill='#fdeeee' stroke='#b4534f' stroke-width='1.6'/><text x='639.0' y='127.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>Demodulator</text><text x='639.0' y='143.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>AM or FM</text><text x='639.0' y='155.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>hardwired</text>
<line x1='558' y1='131.0' x2='577' y2='131.0' stroke='#1a1a1a' stroke-width='1.8' marker-end='url(#a)'/>
<rect x='720' y='105' width='118' height='52' rx='6' fill='#fdeeee' stroke='#b4534f' stroke-width='1.6'/><text x='779.0' y='135.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>Audio amp</text>
<line x1='698' y1='131.0' x2='717' y2='131.0' stroke='#1a1a1a' stroke-width='1.8' marker-end='url(#a)'/>
<line x1='20' y1='173' x2='838' y2='173' stroke='#b4534f' stroke-width='1.2' stroke-dasharray='5 4'/>
<text x='20' y='190' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#b4534f' font-style='italic'>All of it is metal. Changing the mode means changing the hardware.</text>
<text x='20' y='215' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='700' fill='#1a1a1a' >Software-defined radio</text>
<rect x='20' y='228' width='118' height='52' rx='6' fill='#eef3f8' stroke='#33689c' stroke-width='1.6'/><text x='79.0' y='258.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>Antenna</text>
<rect x='160' y='228' width='118' height='52' rx='6' fill='#eef3f8' stroke='#33689c' stroke-width='1.6'/><text x='219.0' y='250.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>RF front end</text><text x='219.0' y='266.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>wideband</text><text x='219.0' y='278.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>LNA + filter</text>
<line x1='138' y1='254.0' x2='157' y2='254.0' stroke='#1a1a1a' stroke-width='1.8' marker-end='url(#a)'/>
<rect x='300' y='228' width='118' height='52' rx='6' fill='#eef3f8' stroke='#33689c' stroke-width='1.6'/><text x='359.0' y='250.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>Mixer + LO</text><text x='359.0' y='266.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>agile, wide</text>
<line x1='278' y1='254.0' x2='297' y2='254.0' stroke='#1a1a1a' stroke-width='1.8' marker-end='url(#a)'/>
<rect x='440' y='228' width='118' height='52' rx='6' fill='#eef3f8' stroke='#33689c' stroke-width='1.6'/><text x='499.0' y='250.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>ADC</text><text x='499.0' y='266.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>12-bit</text><text x='499.0' y='278.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>61.44 MSPS</text>
<line x1='418' y1='254.0' x2='437' y2='254.0' stroke='#1a1a1a' stroke-width='1.8' marker-end='url(#a)'/>
<line x1='569' y1='206' x2='569' y2='320' stroke='#2f7d46' stroke-width='2.2' stroke-dasharray='7 5'/>
<text x='577' y='200' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='700' fill='#2f7d46' >the digital boundary</text>
<rect x='580' y='228' width='118' height='52' rx='6' fill='#eaf6ee' stroke='#2f7d46' stroke-width='1.6'/><text x='639.0' y='250.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>Filter</text><text x='639.0' y='266.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>your taps</text>
<line x1='558' y1='254.0' x2='577' y2='254.0' stroke='#1a1a1a' stroke-width='1.8' marker-end='url(#a)'/>
<rect x='720' y='228' width='118' height='52' rx='6' fill='#eaf6ee' stroke='#2f7d46' stroke-width='1.6'/><text x='779.0' y='250.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>Demodulate</text><text x='779.0' y='266.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>any mode</text>
<line x1='698' y1='254.0' x2='717' y2='254.0' stroke='#1a1a1a' stroke-width='1.8' marker-end='url(#a)'/>
<rect x='860' y='228' width='118' height='52' rx='6' fill='#eaf6ee' stroke='#2f7d46' stroke-width='1.6'/><text x='919.0' y='250.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' font-weight='600' fill='#1a1a1a'>Decode</text><text x='919.0' y='266.0' text-anchor='middle' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#5a6570'>any protocol</text>
<line x1='838' y1='254.0' x2='857' y2='254.0' stroke='#1a1a1a' stroke-width='1.8' marker-end='url(#a)'/>
<text x='577' y='313' text-anchor='start' font-family='DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif' font-size='11.5' font-weight='400' fill='#2f7d46' font-style='italic'>Software. Change the mode by editing a flowgraph - no soldering iron.</text>
</svg>
